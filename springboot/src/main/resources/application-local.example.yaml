# 复制到 springboot/application-local.yaml 后填写；不要放进 src/main/resources，避免密钥进入 JAR。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/code2026?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: 请填写本地数据库密码

jwt:
  secret: 请填写至少32字节的随机密钥

cos:
  secret-id: 请填写腾讯云SecretId
  secret-key: 请填写腾讯云SecretKey
  bucket-name: 请填写腾讯云Bucket名称
  region: ap-guangzhou
