server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    # 真实本地密钥放在 springboot/application-local.yaml，不进入 resources 和生产 JAR。
    import: optional:file:./application-local.yaml
  application:
    name: springboot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://localhost:3306/code2026?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

# COS 配置请通过 application-local.yaml 或服务器 application.properties 覆盖
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket-name: ${COS_BUCKET_NAME:}
  region: ${COS_REGION:ap-guangzhou}
  private-url-minutes: ${COS_PRIVATE_URL_MINUTES:10}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:7200000}

app:
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  album:
    sync-acl-on-startup: ${ALBUM_SYNC_ACL_ON_STARTUP:false}
  bootstrap-admins:
    enabled: ${BOOTSTRAP_ADMINS_ENABLED:false}
    yeeee-password: ${BOOTSTRAP_YEEEE_PASSWORD:}
    chip-password: ${BOOTSTRAP_CHIP_PASSWORD:}
